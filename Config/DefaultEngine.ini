GameDefaultMap=/Game/DarkBlood/Maps/L_Realm.L_Realm
EditorStartupMap=/Engine/Maps/Templates/OpenWorld.OpenWorld
ServerDefaultMap=/Game/DarkBlood/Maps/L_Realm.L_Realm
GlobalDefaultGameMode=/Script/DarkBlood.DBGameMode
GlobalDefaultServerGameMode=/Script/DarkBlood.DBGameMode

[/Script/Engine.RendererSettings]
grass.GrassMap.UseRuntimeGeneration=1
